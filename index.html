
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Practice</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        h1, h2 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 60%;
            border: 1px solid gray;
        }

        button {
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background-color: #eee;
            padding: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete {
            background-color: red;
        }

        #count {
            font-size: 40px;
        }

        .increase {
            background-color: green;
        }

        .decrease {
            background-color: red;
        }

        #myImage {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
        }

    </style>

</head>

<body>


    <!-- Question 1: To-Do List -->

    <div class="container">

        <h2>Question 1: To-Do List</h2>

        <input type="text" id="taskInput" placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>

    </div>


    <script>

        function addTask() {

            let input = document.getElementById("taskInput");

            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            let span = document.createElement("span");
            span.innerText = task;

            let deleteBtn = document.createElement("button");

            deleteBtn.innerText = "Delete";
            deleteBtn.className = "delete";

            deleteBtn.onclick = function() {
                li.remove();
            };

            li.appendChild(span);
            li.appendChild(deleteBtn);

            document.getElementById("taskList").appendChild(li);

            input.value = "";

        }

    </script>


    <!-- Question 2: Counter App -->

    <div class="container">

        <h2>Question 2: Counter App</h2>

        <h1 id="count">0</h1>

        <button class="increase" onclick="increase()">Increase</button>

        <button class="decrease" onclick="decrease()">Decrease</button>

    </div>


    <script>

        let count = 0;

        function increase() {

            count++;

            document.getElementById("count").innerText = count;

        }

        function decrease() {

            count--;

            document.getElementById("count").innerText = count;

        }

    </script>


    <!-- Question 3: Image Changer -->

    <div class="container">

        <h2>Question 3: Image Changer</h2>

        <img id="myImage" src="666251338616960856 (1).jpg" alt="My Image">

        <button onclick="changeImage()">Change Image</button>

    </div>


    <script>

        let images = [
            "666251338616960856 (1).jpg",
            "shahi qila.jpg",
            "Shrine of Allamah Iqbal R_A.jpg",
            "Badshahi Mosque, Lahore, Pakistan.jpg",
            "K2, at 8,611 metres (28,251 ft) above sea level,.jpg",
            "khabar Pass (Pakistan).jpg",
            
        ];

        let index = 0;

        function changeImage() {

            index++;

            if (index >= images.length) {
                index = 0;
            }

            document.getElementById("myImage").src = images[index];

        }

    </script>


</body>
</html>
